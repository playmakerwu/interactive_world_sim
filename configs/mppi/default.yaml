# MPPI hyperparameters — faithful port of diffusion-forcing's
# planner_v0_0 reference. See MPPI_REFERENCE_NOTES.md for the algorithm
# spec and the rationale for every deviation listed below.

# --- algorithm ---
n_sample: 100             # N: trajectory samples per refinement iteration.
                          # Matches reference.
n_look_ahead: 10          # H: planning horizon. Reference uses 40; we use 10
                          # because IWS WM's n_frames=10 and we don't yet
                          # support sliding-window rollouts.
n_update_iter: 5          # Inner refinement iterations per plan_step.
                          # Reference uses 50; reduced because IWS decoder is
                          # compute-bound (each iter at N=100 ≈ 6s decode+CV
                          # at this resolution; 50 iters would put a single
                          # plan_step at ~5 minutes).
noise_level: 0.05         # sigma for the Gaussian action noise. Matches reference.
reward_weight: 200.0      # Multiplier inside softmax(R * reward_weight).
                          # Large value = sharp argmax-like selection.
                          # Matches reference.
beta_filter: 0.7          # Intra-horizon noise smoothing coefficient.
                          # NOTE: this is NOT cross-plan-step warm-start.
                          # See MPPI_REFERENCE_NOTES.md "Three exact formulas"
                          # for the (mis)understanding history. Matches reference.
cv_fail_penalty: -10.0    # Reward for CV-failed trajectories.

# --- action space ---
action_dim: 4             # ALOHA bimanual end-effector deltas.
                          # Matches outputs/pusht_cam1/.hydra/config.yaml:105.
action_lower_lim: [-1.0, -1.0, -1.0, -1.0]
action_upper_lim: [1.0, 1.0, 1.0, 1.0]

# --- run control (consumed by scripts/run_mppi_v2.py, not by MPPIPlanner) ---
control_steps: 50         # plan_step calls per episode
seed: 0                   # planner sampler RNG seed (does not control WM
                          # denoiser noise — that uses the global CUDA RNG)
